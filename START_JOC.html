<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumea lui BUG – Codul celor trei lumi</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#f6f6ff;background:#0a1027}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 5%,#243778,#0a1027 55%);min-height:100vh}.wrap{max-width:960px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:1px;color:#7ef9cf}.chip{border:1px solid #5266a1;border-radius:50px;padding:9px 14px;background:#182449}h1{font-size:clamp(28px,5vw,48px);margin:24px 0 10px}h2{font-size:25px}.muted{color:#bdc9eb;line-height:1.65}.panel{background:#121d40e8;border:1px solid #42578f;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 20px 70px #0005;margin-top:22px}.tag{display:inline-block;background:#284d74;color:#9df9e2;border-radius:99px;padding:7px 13px;font-weight:800;font-size:13px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:22px 0}.choice,.btn{cursor:pointer;border:1px solid #6c82b7;border-radius:14px;background:#202f5c;color:white;padding:15px;font-size:16px;text-align:left;transition:.15s}.choice:hover,.btn:hover{background:#354d8d;transform:translateY(-1px)}.choice.selected{border-color:#79f9cc;background:#255b63}.btn{background:linear-gradient(115deg,#39bfa2,#4278db);font-weight:800;text-align:center;border:0}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#253457}.actions{display:flex;gap:12px;flex-wrap:wrap}.input{width:100%;padding:16px;border-radius:12px;border:1px solid #91a2d5;background:#0c1635;color:white;font-size:19px;margin:14px 0}.progress{height:12px;background:#1e2a50;border-radius:20px;overflow:hidden;margin:15px 0}.bar{height:100%;background:linear-gradient(90deg,#49c9c1,#ffce6e);transition:.3s}.feedback{border-left:4px solid #ffd06b;padding:13px;background:#202d50;margin:15px 0;border-radius:8px;line-height:1.6}.story{font-size:18px;line-height:1.65}.media{width:100%;max-height:350px;background:#000;border-radius:14px;margin:16px 0}.tiny{font-size:13px;color:#aab9de}.hidden{display:none}.gridstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#1e315e;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:26px;color:#80f5d4}@media(max-width:560px){.gridstats{grid-template-columns:1fr 1fr}.panel{padding:18px}}</style></head><body><div class="wrap"><header class="top"><div class="brand">✦ LUMEA LUI BUG <span class="tiny">BUG · BITZI · LUKI · GUMB</span></div><div class="chip" id="score">⭐ 0 puncte</div></header><main id="app"></main><footer class="tiny" style="padding:22px 0">Joc educațional original • Clasa a IV-a • Limba română, matematică, științe ale naturii • Videoclipuri originale furnizate de creator</footer></div><script>
const vids==['media/BUG_and_Friends_The_Lost_Seasons_Portal_FINAL.mp4','media/BITZI_The_Secret_Door_15s_AI_Generated.mp4','media/Cartoon_characters_solving_equation_40c6a16f.mp4'];
const levels=[
{subject:'Limba română',who:'BITZI',title:'Mesajul ascuns în bibliotecă',story:'Pe un pergament scrie: „Deși ploaia se oprise, poteca era încă umedă. Copiii au pornit spre turn, deoarece acolo se afla cheia.” Care este relația exprimată de „deoarece”?',type:'choice',options:['O cauză / o explicație','O comparație','O enumerare','O opoziție'],answer:0,explain:'„Deoarece” introduce motivul pentru care copiii au pornit spre turn.'},
{subject:'Limba română',who:'BUG',title:'Pronumele din cod',story:'În enunțul „Ei au găsit-o lângă stejar”, ce parte de vorbire este „Ei”?',type:'choice',options:['Substantiv comun','Pronume personal','Adjectiv','Verb'],answer:1,explain:'„Ei” este pronume personal, persoana a III-a, numărul plural.'},
{subject:'Limba română',who:'LUKI',title:'Povestea în ordinea corectă',story:'Așază evenimentele logic: (A) Au descifrat harta. (B) Au descoperit o cutie încuiată. (C) Au pornit spre pădure după ce au citit harta. Scrie cele trei litere, fără spații.',type:'text',answer:'ACB',explain:'Mai întâi au descifrat harta, apoi au pornit și la final au găsit cutia.'},
{subject:'Limba română',who:'GUMB',title:'Forma corectă',story:'Completează enunțul: „Dacă aș fi știut secretul, _______ mai devreme.”',type:'choice',options:['veneam','aș fi venit','voi veni','am să vin'],answer:1,explain:'Construcția condițională exprimă o acțiune ipotetică din trecut: „aș fi venit”.'},
{subject:'Matematică',who:'BUG',title:'Codul numerelor mari',story:'Poarta acceptă doar numărul obținut astfel: 48 672 − 19 845 + 7 936. Scrie rezultatul fără separatori.',type:'number',answer:36763,explain:'48 672 − 19 845 = 28 827; 28 827 + 7 936 = 36 763.'},
{subject:'Matematică',who:'BITZI',title:'Fracțiile cristalului',story:'Un cristal are 240 de unități de energie. Se consumă 3/8 din energie. Câte unități rămân?',type:'number',answer:150,explain:'3/8 din 240 = 90; rămân 240 − 90 = 150.'},
{subject:'Matematică',who:'LUKI',title:'Harta dreptunghiulară',story:'O grădină dreptunghiulară are perimetrul de 74 m și lungimea de 23 m. Care este lățimea în metri?',type:'number',answer:14,explain:'Semiperimetrul este 37 m, deci lățimea este 37 − 23 = 14 m.'},
{subject:'Matematică',who:'GUMB',title:'Problema în trei etape',story:'Echipa adună 6 cutii cu câte 24 de piese. Folosește 57 de piese, iar restul se împarte egal în 3 săculeți. Câte piese sunt într-un săculeț?',type:'number',answer:29,explain:'6 × 24 = 144; 144 − 57 = 87; 87 : 3 = 29.'},
{subject:'Științe ale naturii',who:'BUG',title:'Circuitul apei',story:'Vaporii de apă se răcesc și se transformă în picături care formează norii. Cum se numește procesul?',type:'choice',options:['Evaporare','Condensare','Topire','Dizolvare'],answer:1,explain:'Condensarea este trecerea vaporilor de apă în stare lichidă.'},

{subject:'Științe ale naturii',who:'LUKI',title:'Umbra de la observator',story:'La aceeași oră, într-o zi senină, o umbră apare deoarece...',type:'choice',options:['lumina trece prin orice obiect','un corp opac împiedică trecerea luminii','aerul devine întunecat','Pământul nu se mai rotește'],answer:1,explain:'Corpurile opace blochează lumina și formează o zonă umbrită.'},
{subject:'Misiunea finală',who:'TOȚI',title:'Codul portalului',story:'Folosește toate lumile: în propoziția „Copiii au plantat 4 rânduri cu câte 18 puieți”, câți puieți sunt în total? Scrie numărul. Indiciu: înmulțirea te ajută să afli totalul.',type:'number',answer:72,explain:'4 × 18 = 72 de puieți. Ai combinat înțelegerea textului cu matematica și grija pentru natură.'}
];
let i=-1,score=0,tries=0,hints=0,selected=null,locked=false;const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function update(){document.getElementById('score').textContent='⭐ '+score+' puncte'}function video(n){return '<video class="media" controls preload="metadata" playsinline src="'+encodeURI(vids[n])+'"></video><div class="tiny">Audio original din videoclipul încărcat. Apasă ▶ pentru a-l asculta.</div>'}function start(){i=0;score=0;hints=0;update();show()}function intro(){app.innerHTML='<section class="panel"><span class="tag">AVENTURĂ INTERDISCIPLINARĂ · CLASA A IV-A</span><h1>🔮 Codul celor trei lumi</h1><p class="story">Portalul anotimpurilor s-a blocat. BUG, BITZI, LUKI și GUMB au nevoie de tine pentru a recupera 12 fragmente de cod din biblioteca cuvintelor, laboratorul numerelor și observatorul naturii.</p>'+video(0)+'<div class="gridstats"><div class="stat"><b>12</b>provocări</div><div class="stat"><b>3</b>materii</div><div class="stat"><b>120</b>puncte posibile</div></div><p class="muted">Răspunsurile greșite oferă o explicație și posibilitatea de a încerca din nou. Ai indicii, dar folosirea lor reduce recompensa. Videoclipurile păstrează vocile originale; instrucțiunile jocului sunt scrise în română.</p><button class="btn" onclick="start()">Începe misiunea →</button></section>'}function show(){if(i>=levels.length)return end();tries=0;selected=null;locked=false;const q=levels[i],pct=Math.round(i/levels.length*100);let media=(i===4?video(2):i===8?video(3):i===11?video(4):'');app.innerHTML='<section class="panel"><div class="top"><span class="tag">'+esc(q.subject)+' · MISIUNEA '+(i+1)+'/12</span><span class="chip">Ghid: '+esc(q.who)+'</span></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><h2>'+esc(q.title)+'</h2><p class="story">'+esc(q.story)+'</p>'+media+(q.type==='choice'?'<div class="choices">'+q.options.map((x,k)=>'<button class="choice" id="c'+k+'" onclick="choose('+k+')">'+esc(x)+'</button>').join('')+'</div>':'<input class="input" id="ans" autocomplete="off" placeholder="Scrie răspunsul aici" onkeydown="if(event.key===\'Enter\')check()">')+'<div id="feedback"></div><div class="actions"><button class="btn" id="verify" onclick="check()">Verifică răspunsul</button><button class="btn secondary" id="hint" onclick="hint()">💡 Indiciu (−3 puncte)</button><button class="btn hidden" id="next" onclick="i++;show()">Următoarea provocare →</button></div></section>'}function choose(k){if(locked)return;selected=k;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',j===k))}function hint(){if(locked)return;hints++;document.getElementById('hint').disabled=true;document.getElementById('feedback').innerHTML='<div class="feedback">💡 '+esc(levels[i].explain.split(';')[0])+'</div>'}function check(){if(locked)return;const q=levels[i];let a=q.type==='choice'?selected:document.getElementById('ans').value.trim();if(a===null||a===''){document.getElementById('feedback').innerHTML='<div class="feedback">Alege sau scrie un răspuns înainte de verificare.</div>';return}const ok=q.type==='number'?Number(String(a).replace(/\s/g,''))===q.answer:q.type==='text'?String(a).replace(/\s/g,'').toUpperCase()===q.answer:a===q.answer;if(ok){locked=true;const gain=Math.max(2,10-(tries*3)-(hints?3:0));score+=gain;update();document.getElementById('feedback').innerHTML='<div class="feedback">✨ Corect! +'+gain+' puncte. '+esc(q.explain)+'</div>';document.getElementById('verify').classList.add('hidden');document.getElementById('hint').classList.add('hidden');document.getElementById('next').classList.remove('hidden');if(q.type==='choice')document.querySelectorAll('.choice').forEach(b=>b.disabled=true)}else{tries++;document.getElementById('feedback').innerHTML='<div class="feedback">🔍 Nu încă! Verifică atent datele și încearcă din nou. '+(tries>=2?esc(q.explain):'Poți folosi indiciul.')+'</div>'}}function end(){const rank=score>=95?'Maestru al portalurilor':score>=70?'Explorator de elită':'Explorator perseverent';app.innerHTML='<section class="panel"><span class="tag">MISIUNE ÎNCHEIATĂ</span><h1>🎉 Portalul s-a deschis!</h1>'+video(5)+'<p class="story">Ai încheiat aventura alături de BUG, BITZI, LUKI și GUMB.</p><div class="gridstats"><div class="stat"><b>'+score+'</b>puncte</div><div class="stat"><b>12/12</b>misiuni</div><div class="stat"><b>🏆</b>'+rank+'</div></div><p class="muted">Poți rejuca aventura pentru un scor mai bun. Întrebările sunt inspirate din competențe uzuale pentru clasa a IV-a; nu reprezintă o evaluare oficială.</p><button class="btn" onclick="intro()">Joacă din nou ↻</button></section>'}intro();
</script></body></html>
